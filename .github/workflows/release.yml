name: Release

on:
  push:
    tags:
      # GitHub Actions tag filters are globs (not regex): `[0-9]+` would match a
      # literal '+', so use `[0-9]*` which matches one-or-more digits per segment.
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected environment: the run waits for the maintainer's approval, only `v*` tags may
    # deploy to it, and npm's trusted publisher for this package accepts only this workflow
    # running in this environment.
    environment: npm

    permissions:
      contents: write # create the GitHub Release
      id-token: write # mint OIDC token for npm trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # trusted publishing needs npm >= 11.5.1 / Node >= 22.14.0
          registry-url: https://registry.npmjs.org
          # No dependency cache in the publish job: a poisoned cache could reach the OIDC
          # token (npm trusted-publishing docs). Explicit, though package.json has no
          # packageManager field to trigger setup-node's automatic caching.
          package-manager-cache: false

      # Fail fast before the heavy build if the tag and package.json disagree —
      # this guard reads only the tag name and package.json, so run it first.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # No audit step: the dependency audit fails local builds only (npm run
      # audit, first in validate) and skips itself here because GITHUB_ACTIONS is set.
      - name: Build (runs typecheck + lint + format:check + tests with 100% coverage enforcement + doc-example typecheck)
        run: npm run build

      - name: Verify package exports
        run: npm run verify:exports

      # Authenticates via OIDC trusted publishing (no token). Provenance is
      # attached automatically for a public package from a public repo.
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
